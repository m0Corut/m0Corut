name: CNC contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cnc.mjs
      - .github/workflows/cnc.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Machine the contribution sheet
        env:
          # CNC_TOKEN (a PAT with read:user) also counts private contributions; falls back to GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.CNC_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: node scripts/cnc.mjs

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Render CNC contributions"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
